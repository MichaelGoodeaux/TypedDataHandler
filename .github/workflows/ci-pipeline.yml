name: publish-npm

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm   # replaces your manual cache step
      - run: npm ci
      - run: npm test

  publishNpm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # lets GitHub issue the identity token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
      - run: npm ci
      - run: npm publish
